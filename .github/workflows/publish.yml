name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # Need write for creating releases
  id-token: write # Required for OIDC trusted publishing to npm

jobs:
  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate semver tag
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Validating tag: $TAG"
          if ! echo "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Tag '$TAG' does not match semver format (vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "Tag is valid semver"

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag: $TAG"
          echo "Version: $VERSION"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js for npm publishing
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - name: Ensure npm 11.5.1+ for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify version matches tag
        run: |
          PACKAGE_VERSION=$(cat package.json | grep '"version"' | head -1 | sed 's/.*"version": "\(.*\)".*/\1/')
          echo "Package version: $PACKAGE_VERSION"
          echo "Tag version: ${{ steps.version.outputs.version }}"
          if [ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag version (${{ steps.version.outputs.version }})"
            exit 1
          fi
          echo "Version match confirmed"

      - name: Run checks
        run: pnpm check

      - name: Build CLI
        run: pnpm build:cli

      - name: Verify CLI build
        run: |
          if [ ! -f dist/index.js ]; then
            echo "Error: CLI build failed - dist/index.js not found"
            exit 1
          fi
          echo "CLI build verified"

      - name: Build Actions
        run: pnpm build:actions

      - name: Verify Actions build
        run: |
          if [ ! -f .github/actions/track-metrics/dist/track-metrics.mjs ]; then
            echo "Error: track-metrics action build failed"
            exit 1
          fi
          if [ ! -f .github/actions/quality-gate/dist/quality-gate.mjs ]; then
            echo "Error: quality-gate action build failed"
            exit 1
          fi
          echo "Actions build verified"

      - name: Check if version already published
        id: check_published
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view unentropy@$VERSION version 2>/dev/null; then
            echo "Version $VERSION already published to npm"
            echo "published=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not yet published"
            echo "published=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm with trusted publishing
        if: steps.check_published.outputs.published == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Publishing stable version $VERSION with --tag latest"
          npm publish
          echo "Successfully published unentropy@$VERSION to npm"

      - name: Skip npm publish (already published)
        if: steps.check_published.outputs.published == 'true'
        run: |
          echo "Skipping npm publish - version already exists"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: |
            Release ${{ steps.version.outputs.tag }}

            **npm Package:** https://www.npmjs.com/package/unentropy/v/${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ startsWith(steps.version.outputs.version, '0.') }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload action artifacts
        uses: actions/upload-artifact@v7
        with:
          name: actions-dist
          path: .github/actions/
          retention-days: 1

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

  publish-actions:
    name: Publish ${{ matrix.action }} Action
    runs-on: ubuntu-latest
    needs: publish
    timeout-minutes: 5
    strategy:
      matrix:
        action: [track-metrics, quality-gate]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download action artifacts
        uses: actions/download-artifact@v8
        with:
          name: actions-dist
          path: source

      - name: Publish action
        uses: ./.github/actions/publish-action
        with:
          action-name: ${{ matrix.action }}
          target-repo: unentropy/${{ matrix.action }}
          version: ${{ needs.publish.outputs.version }}
          tag: ${{ needs.publish.outputs.tag }}
          source-path: source/${{ matrix.action }}
          publish-token: ${{ secrets.ACTIONS_PUBLISH_TOKEN }}
